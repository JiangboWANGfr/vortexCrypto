# The paper's S0-S3 matrix.
#
# NOT ci/testcases/crypto.yaml. That file is regression coverage, sized for CI:
# one point per case, at the default shape, each implementation built alone.
# Those are different numbers -- ChaCha-Poly S2 fits to 1.08 c/B there and
# 1.90 c/B in the configuration the document reports, a 43% spread from
# configuration alone against a noise floor of 3% (memory-bound) to 9%
# (cache-resident). The two must not share a records.csv.
#
# One build per algorithm; the tier is chosen with -i. At n=128 the
# small-footprint fit reads b=1,2,4 for chacha_poly (8-32 KiB total) and
# b=2,4,8 for aes_gcm (4-16 KiB); the large-footprint fit reads b=16,24,32
# (128-256 KiB) and b=32,48,64 (64-128 KiB) -- the block being 64 bytes for
# one algorithm and 16 for the other. Three points per regime for the
# mainline tiers (S1, S2, and each algorithm's subgroup form); the S0 and
# SG4 rows keep two. chacha b=8 and aes b=16 are knee diagnostics between
# the regimes; no fit reads them.
#
# The shape is not here: bench.py supplies the recorded c2w4t16 via --shape.
#
#   tests/crypto/bench.py --yaml tests/crypto/measurements.yaml --runs build32/crypto_runs/measure
category: crypto_measure
defaults:
  xlen:
  - 32
  tier: full
tests:
- id: sw_ttable-aes0-b2
  via: make-run
  drivers:
  - rtlsim
  dir: tests/crypto/aes_gcm
  target: run-{driver}
  configs: -DVX_CFG_EXT_AUTH_ENABLE -DVX_CFG_EXT_AUTH_S2_ENABLE -DVX_CFG_EXT_AUTH_SG4_ENABLE -DVX_CFG_EXT_SYM_ENABLE -DVX_CFG_EXT_SYM_S2_ENABLE -DVX_CFG_EXT_SYM_SG4_ENABLE
  vars:
    OPTS: -n128 -b2 -i0
- id: sw_ttable-aes0-b8
