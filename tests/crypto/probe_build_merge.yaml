# Why one build per algorithm is safe: the measurement behind that decision.
#
# ChaCha was brought up in three narrow builds -- S1 alone, S1+S2, S1+SG4 --
# and for a while the paper's tables came from all three, with an S1 row
# repeated in each as an anchor against build-to-build drift. This probe runs
# every implementation in a single all-on build to ask whether that was
# necessary.
#
# It was not. The all-on build compiles byte-identical code: every instruction
# count matches the narrow builds to the digit. Per-run cycles differ by at most
# 2.7%, and all three tier speedups reproduce inside the noise floor -- S1
# 1.64x against 1.69x, S2 3.87x against 3.9x, S3 1.28x against 1.26x.
#
# The one large divergence, up to 13.9% on a cache-resident fit, is a
# *cross-build* comparison of that identical code, amplified 8.1x by the fit.
# That is an argument for not comparing across builds, which is exactly what a
# single build removes. measurements.yaml therefore uses one build per
# algorithm, the tier chosen with -i, and carries no anchor rows.
#
# Area and Fmax are the opposite case and still come from isolated builds: what
# a design costs is what *it* costs, not what every experimental design costs
# when compiled together.
#
#   tests/crypto/bench.py --yaml tests/crypto/probe_build_merge.yaml \
#                         --runs build32/crypto_runs/probe
category: crypto_probe
defaults:
  xlen:
  - 32
  tier: full
tests:
- id: p-sw-b1
  via: make-run
  drivers:
  - rtlsim
  dir: tests/crypto/chacha_poly
  target: run-{driver}
  configs: -DVX_CFG_EXT_SYM_ENABLE -DVX_CFG_EXT_AUTH_ENABLE -DVX_CFG_EXT_AUTH_POLY_ENABLE -DVX_CFG_EXT_AUTH_POLY_SG4_ENABLE -DVX_CFG_EXT_SYM_CHACHA_ENABLE -DVX_CFG_EXT_SYM_CHACHA_S2_ENABLE -DVX_CFG_EXT_SYM_CHACHA_SG4_ENABLE
  vars:
    OPTS: -n64 -b1 -i0
