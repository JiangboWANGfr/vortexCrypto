# Methodology probe: can ONE all-on build replace the three narrow ChaCha
# builds of measurements.yaml?
#
# Answer, from running it: the code is identical -- every instruction count
# matches the narrow builds to the digit -- and per-run cycles differ by at most
# 2.7%. But the two-point cache-resident fits of that identical code diverge by
# up to 13.9% (s2), because the fit amplifies endpoint error by 8.1x there.
# That is the measurement behind section 23's split noise floor: 3% at the
# memory-bound point, 9% at the cache-resident one.
#
# Keep the three narrow builds. Not because the builds disagree -- they do not --
# but because this probe is what shows the cache-resident figure needs the wider
# floor, and it has to stay reproducible.
#
#   tests/crypto/bench.py --yaml tests/crypto/probe_build_merge.yaml \
#                         --runs build32/crypto_runs/probe
category: crypto_probe
defaults:
  xlen:
  - 32
  tier: full
tests:
- id: p-sw-b1
  via: make-run
  drivers:
  - rtlsim
  dir: tests/crypto/chacha_poly
  target: run-{driver}
  configs: -DVX_CFG_EXT_SYM_ENABLE -DVX_CFG_EXT_AUTH_ENABLE -DVX_CFG_EXT_AUTH_POLY_ENABLE -DVX_CFG_EXT_AUTH_POLY_SG4_ENABLE -DVX_CFG_EXT_SYM_CHACHA_ENABLE -DVX_CFG_EXT_SYM_CHACHA_S2_ENABLE -DVX_CFG_EXT_SYM_CHACHA_SG4_ENABLE
  vars:
    OPTS: -n64 -b1 -i0
