# The message-count sweep: at what -n does every implementation saturate the
# c2w4t16 machine?
#
# Lane-mapped kernels stride messages by global thread id, so -n below the
# thread count (128) leaves core 1 without a single message; subgroup-mapped
# kernels stride by subgroup id and fill both cores from -n8. Any matrix that
# compares the two mappings at -n64 is comparing one active core against two.
# This file measures each mapping at n = 64, 128 and 256 so the matrix's n can
# be chosen from evidence: take the smallest n at which every (build, impl, b)
# shows an even per-core MINSTRET split (balance >= 0.90).
# tests/crypto/saturation.py reads the records, applies that rule, and also
# prints the marginal slope across the b points -- the matrix's own metric --
# whose drift past the balanced n is the working set moving through cache/DRAM
# regimes, not utilisation. The 2026-08 sweep's answer was n=128 for both apps.
#
# Two payload sizes per implementation, one from each cache regime of the
# measurement matrix (b=4/16 for chacha_poly, b=8/32 for aes_gcm).
#
#   tests/crypto/bench.py --yaml tests/crypto/saturation.yaml --runs build32/crypto_runs/saturation
#   tests/crypto/saturation.py build32/crypto_runs/saturation/records.csv
category: crypto_saturation
defaults:
  xlen:
  - 32
  tier: full
tests:
- id: rori-chacha0-b4-n64
  via: make-run
  drivers:
  - rtlsim
  dir: tests/crypto/chacha_poly
  target: run-{driver}
  configs: -DVX_CFG_EXT_AUTH_ENABLE -DVX_CFG_EXT_AUTH_POLY_ENABLE -DVX_CFG_EXT_AUTH_POLY_SG4_ENABLE -DVX_CFG_EXT_SYM_CHACHA_ENABLE -DVX_CFG_EXT_SYM_CHACHA_S2_ENABLE -DVX_CFG_EXT_SYM_CHACHA_SG4_ENABLE -DVX_CFG_EXT_SYM_ENABLE
  vars:
    OPTS: -n64 -b4 -i1
