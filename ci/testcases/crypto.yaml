# Test cases for `crypto`: software cryptography baselines. Driven through the
# tests/crypto family Makefile so one case covers every app in the family and
# gains new ones for free. blackbox also reaches them, as `--app=crypto/<app>`
# via its generic tests/<app> branch, which is the route to use when a case
# needs per-app shape flags. Each case here runs at the app's Makefile OPTS
# default, which is sized for CI rather than for measurement.
category: crypto
defaults:
  xlen:
  - 32
  tier: smoke
tests:
- id: crypto-family-1
  via: make-run
  drivers:
  - simx
  dir: tests/crypto
  target: run-{driver}
- id: crypto-family-2
  via: make-run
  drivers:
  - rtlsim
  dir: tests/crypto
  target: run-{driver}
# isa_check is deliberately NOT in the tests/crypto family list: it is the only
# app here that requires the crypto units to be enabled, and the family cases
# above run at the shipped defaults where they are off. It would then execute
# the encodings as whatever they alias to and fail. It gets its own cases with
# the configs attached.
#
# Both drivers are run because this test's whole purpose is to prove RTL and
# simx agree bit-exactly; dropping either one removes the comparison.
- id: crypto-isa-check-1
  via: make-run
  drivers:
  - simx
  dir: tests/crypto/isa_check
  target: run-{driver}
  configs: -DVX_CFG_EXT_SYM_ENABLE -DVX_CFG_EXT_AUTH_ENABLE
- id: crypto-isa-check-2
  via: make-run
  drivers:
  - rtlsim
  dir: tests/crypto/isa_check
  target: run-{driver}
  configs: -DVX_CFG_EXT_SYM_ENABLE -DVX_CFG_EXT_AUTH_ENABLE
# The hardware AES-GCM kernel. Without these it has NO regression coverage:
# tests/crypto/aes_gcm defaults to `-i0` (main.cpp g_impl = 0) and the family
# cases above run at the Makefile's OPTS default, so every case so far exercises
# only the software baseline. isa_check covers the five instructions
# individually; nothing covered the kernel that composes them, which is exactly
# where the byte-order bugs were -- the AES state packing and the GHASH bit
# reflection are both silent when wrong.
- id: crypto-aes-gcm-hw-1
  via: make-run
  drivers:
  - simx
  dir: tests/crypto/aes_gcm
  target: run-{driver}
  configs: -DVX_CFG_EXT_SYM_ENABLE -DVX_CFG_EXT_AUTH_ENABLE
  vars:
    OPTS: -n64 -b4 -i1
- id: crypto-aes-gcm-hw-2
  via: make-run
  drivers:
  - rtlsim
  dir: tests/crypto/aes_gcm
  target: run-{driver}
  configs: -DVX_CFG_EXT_SYM_ENABLE -DVX_CFG_EXT_AUTH_ENABLE
  vars:
    OPTS: -n64 -b4 -i1
# The cases above all run at the default 4-thread shape, so NUM_SYM_LANES and
# NUM_AUTH_LANES are 4 and the wide-SIMD elaboration is never built. Every
# recorded measurement is taken at 16 lanes across 2 cores, and VX_config.toml
# flags lane count as the risky axis: lanes are pinned to SIMD_WIDTH to keep
# NUM_PACKETS at 1, which is what makes bottom-of-priority commit placement
# survivable. A width-dependent bug in the lane replication, in VX_lane_dispatch's
# divisibility assertion, or in commit arbitration would ship green without this.
- id: crypto-aes-gcm-hw-wide
  via: make-run
  drivers:
  - rtlsim
  dir: tests/crypto/aes_gcm
  target: run-{driver}
  configs: -DVX_CFG_EXT_SYM_ENABLE -DVX_CFG_EXT_AUTH_ENABLE -DVX_CFG_NUM_CORES=2 -DVX_CFG_NUM_THREADS=16
  vars:
    OPTS: -n32 -b4 -i1
- id: crypto-isa-check-wide
  via: make-run
  drivers:
  - rtlsim
  dir: tests/crypto/isa_check
  target: run-{driver}
  configs: -DVX_CFG_EXT_SYM_ENABLE -DVX_CFG_EXT_AUTH_ENABLE -DVX_CFG_NUM_CORES=2 -DVX_CFG_NUM_THREADS=16
# AAD and partial final blocks. Every case above runs at its app's Makefile OPTS
# default, which is `-a0 -t0`: the AAD absorb, the zero-padded tail and the
# length block that carries both lengths had NO regression coverage, and they are
# where the byte-order and padding mistakes live -- a wrong pad or a wrong length
# block produces a plausible ciphertext with a wrong tag. `-t5` is a fragment
# smaller than one authentication block and `-t37` spans three of them, so the
# ChaCha20 case also exercises a tail that is more than one Poly1305 block.
# Both drivers: the tail is the only byte-granular path in either kernel, and an
# unaligned access is a trap in the RTL that simx does not necessarily reproduce.
- id: crypto-aes-gcm-aad-tail
  via: make-run
  drivers:
  - simx
  - rtlsim
  dir: tests/crypto/aes_gcm
  target: run-{driver}
  vars:
    OPTS: -n64 -b4 -t5 -a20
# The hardware kernel implements AAD and the tail SEPARATELY from the software
# one -- different padding code, different byte order, its own length block --
# so covering the software path says nothing about it.
- id: crypto-aes-gcm-hw-aad-tail
  via: make-run
  drivers:
  - simx
  - rtlsim
  dir: tests/crypto/aes_gcm
  target: run-{driver}
  configs: -DVX_CFG_EXT_SYM_ENABLE -DVX_CFG_EXT_AUTH_ENABLE
  vars:
    OPTS: -n64 -b4 -t5 -a20 -i1
- id: crypto-chacha-poly-aad-tail
  via: make-run
  drivers:
  - simx
  - rtlsim
  dir: tests/crypto/chacha_poly
  target: run-{driver}
  vars:
    OPTS: -n64 -b1 -t37 -a20
# Perf-regression gates for the two software baselines. Their cycle counts are
# what docs/proposals/crypto_isa_proposal.md compares every instruction against,
# and nothing was watching them: the post-AAD drift recorded in section 12 was
# found by hand, days of runs after it landed. These gate the shape CI can
# afford -- each app's own default -- not the recorded measurement point, so they
# catch drift rather than reproduce the document's numbers.
#
# No model_parity twin, deliberately: section 5 records a simx-versus-rtlsim
# cycle gap that GROWS with problem size (6.3% at -b4, 16.3% at -b64). That is an
# unresolved modelling discrepancy, and a parity gate here would either fail or
# have to carry a tolerance wide enough to be meaningless.
- id: perf_gate-aes-gcm-sw
  check: perf_gate
  tier: full
  via: blackbox
  app: crypto/aes_gcm
  args: -n64 -b4 -i0
- id: perf_gate-chacha-poly-sw
  check: perf_gate
  tier: full
  via: blackbox
  app: crypto/chacha_poly
  args: -n64 -b1 -i0
# The S3 probe (section 17). It fired its own kill rules and is kept as evidence
# rather than as a candidate, but it is a kernel in the tree and a kernel in the
# tree with no coverage rots: it is the only thing here that issues a cross-lane
# instruction, and the two models disagree about a masked source lane, so a
# change to SHFL would break it silently. simx only -- it is not a measurement.
- id: crypto-aes-gcm-sg4-probe
  via: make-run
  drivers:
  - simx
  dir: tests/crypto/aes_gcm
  target: run-{driver}
  configs: -DVX_CFG_EXT_SYM_ENABLE -DVX_CFG_EXT_AUTH_ENABLE
  vars:
    OPTS: -n64 -b4 -i3
# The payload-layout diagnostic of section 18.1. Same reasoning as the probe
# above: it is a kernel in the tree, and its host path lays the reference out
# differently, which is the part that would rot silently.
- id: crypto-aes-gcm-ilv-diag
  via: make-run
  drivers:
  - simx
  dir: tests/crypto/aes_gcm
  target: run-{driver}
  configs: -DVX_CFG_EXT_SYM_ENABLE -DVX_CFG_EXT_AUTH_ENABLE
  vars:
    OPTS: -n64 -b4 -i4
# True S3 (section 20): a quad of four lanes owns one message end to end. It is
# the only kernel here that is wrong if a quad ever diverges, and the failure is
# silent -- correct counter, correct lane mapping, wrong cipher -- so it is worth
# a case on both drivers rather than one.
- id: crypto-aes-gcm-s3
  via: make-run
  drivers:
  - simx
  - rtlsim
  dir: tests/crypto/aes_gcm
  target: run-{driver}
  configs: -DVX_CFG_EXT_SYM_ENABLE -DVX_CFG_EXT_AUTH_ENABLE
  vars:
    OPTS: -n64 -b4 -a20 -i6
# The fused subgroup round (section 21). Needs its own configs because the
# instruction, its decode arm and its datapath are all behind
# VX_CFG_EXT_SYM_SG4_ENABLE; without it the entry point does not exist and the
# app refuses rather than computing something else. Both drivers, because the
# whole point of the instruction is that RTL and simx agree on a cross-lane
# operation where SHFL currently does not.
- id: crypto-aes-gcm-s3-fused
  via: make-run
  drivers:
  - simx
  - rtlsim
  dir: tests/crypto/aes_gcm
  target: run-{driver}
  configs: -DVX_CFG_EXT_SYM_ENABLE -DVX_CFG_EXT_AUTH_ENABLE -DVX_CFG_EXT_SYM_SG4_ENABLE
  vars:
    OPTS: -n64 -b4 -a20 -i7
# The subgroup GF(2^128) multiply (section 21.5). It is a null as a performance
# result and is kept as evidence, but it is a cross-lane instruction in two
# models and that is exactly what rots silently, so it gets both drivers.
# The stateful per-lane engines (section 22). simx only, and deliberately so:
# there is no RTL for them yet, so rtlsim would not have the instructions at all.
# They are kernels in the tree and a kernel with no coverage rots -- these are
# the only ones here that carry architectural state across instructions, so a
# change to the context indexing or to the key schedule would be silent.
# The AAD/tail case matters more here than elsewhere: the tail path re-enters
# aes.begin mid-message, which is where a wrong round counter would show.
# ChaCha20's fused xor-then-rotate. Both drivers: the encoding shares the
# custom-3 opcode arm with two unrelated features, each behind its own guard,
# and a build with only this one enabled has already once decoded to nothing --
# simx aborted, the RTL hung the scoreboard 100,000 cycles later. Only a case
# built with exactly these configs would have caught it.
- id: crypto-chacha-poly-xr
  via: make-run
  drivers:
  - simx
  - rtlsim
  dir: tests/crypto/chacha_poly
  target: run-{driver}
  configs: -DVX_CFG_EXT_SYM_ENABLE -DVX_CFG_EXT_AUTH_ENABLE -DVX_CFG_EXT_SYM_CHACHA_ENABLE
  vars:
    OPTS: -n64 -b4 -t37 -a20 -i5
# Poly1305's three-source multiply-accumulate, and the complete S1 row that
# pairs it with the fused xor-rotate. Both drivers: rs3 is read by only one
# other instruction in the machine (WGATHER), so an operand-collector or
# scoreboard change would break these and nothing else would notice.
- id: crypto-chacha-poly-mac
  via: make-run
  drivers:
  - simx
  - rtlsim
  dir: tests/crypto/chacha_poly
  target: run-{driver}
  configs: -DVX_CFG_EXT_SYM_ENABLE -DVX_CFG_EXT_AUTH_ENABLE -DVX_CFG_EXT_AUTH_POLY_ENABLE
  vars:
    OPTS: -n64 -b4 -t37 -a20 -i6
- id: crypto-chacha-poly-s1
  via: make-run
  drivers:
  - simx
  - rtlsim
  dir: tests/crypto/chacha_poly
  target: run-{driver}
  configs: -DVX_CFG_EXT_SYM_ENABLE -DVX_CFG_EXT_AUTH_ENABLE -DVX_CFG_EXT_AUTH_POLY_ENABLE -DVX_CFG_EXT_SYM_CHACHA_ENABLE
  vars:
    OPTS: -n64 -b4 -t37 -a20 -i7
- id: crypto-aes-gcm-s2-aes
  via: make-run
  drivers:
  - simx
  dir: tests/crypto/aes_gcm
  target: run-{driver}
  configs: -DVX_CFG_EXT_SYM_ENABLE -DVX_CFG_EXT_AUTH_ENABLE -DVX_CFG_EXT_SYM_S2_ENABLE
  vars:
    OPTS: -n64 -b4 -t5 -a20 -i9
- id: crypto-aes-gcm-s2
  via: make-run
  drivers:
  - simx
  dir: tests/crypto/aes_gcm
  target: run-{driver}
  configs: -DVX_CFG_EXT_SYM_ENABLE -DVX_CFG_EXT_AUTH_ENABLE -DVX_CFG_EXT_SYM_S2_ENABLE -DVX_CFG_EXT_AUTH_S2_ENABLE
  vars:
    OPTS: -n64 -b4 -t5 -a20 -i10
# The interleaved-layout twin, for the same reason hw_s1_ilv has a case: its
# host path lays the reference out differently and that is what rots silently.
- id: crypto-aes-gcm-s2-ilv
  via: make-run
  drivers:
  - simx
  dir: tests/crypto/aes_gcm
  target: run-{driver}
  configs: -DVX_CFG_EXT_SYM_ENABLE -DVX_CFG_EXT_AUTH_ENABLE -DVX_CFG_EXT_SYM_S2_ENABLE -DVX_CFG_EXT_AUTH_S2_ENABLE
  vars:
    OPTS: -n64 -b4 -i11
- id: crypto-aes-gcm-s3-ghmul
  via: make-run
  drivers:
  - simx
  - rtlsim
  dir: tests/crypto/aes_gcm
  target: run-{driver}
  configs: -DVX_CFG_EXT_SYM_ENABLE -DVX_CFG_EXT_AUTH_ENABLE -DVX_CFG_EXT_SYM_SG4_ENABLE -DVX_CFG_EXT_AUTH_SG4_ENABLE
  vars:
    OPTS: -n64 -b4 -a20 -i8
